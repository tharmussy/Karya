
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Karya</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* GENERAL STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #3026cf;
            --dark-blue: #111052;
            --yellow: #ffb900;
            --text: #252830;
            --gray: #777783;
            --border: #c9c9d2;
            --white: #ffffff;
        }

        body {
            font-family: "Inter", Arial, sans-serif;
            background: var(--white);
            color: var(--text);
            min-height: 100vh;
        }

        /* DECORATIVE SAFARI BROWSER BAR */
        .browser-bar {
            height: 87px;
            background: #f8f8fa;
            border-bottom: 1px solid #eeeeef;
            display: flex;
            align-items: center;
            padding: 0 27px;
            gap: 24px;
        }

        .traffic-lights {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .red { background: #ff605c; }
        .yellow-light { background: #ffbd44; }
        .green { background: #00ca4e; }

        .browser-arrows {
            color: #777;
            font-size: 28px;
            display: flex;
            gap: 15px;
        }

        .address-bar {
            flex: 1;
            height: 29px;
            background: #eeeeF1;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #aaaab0;
            font-size: 12px;
            position: relative;
        }

        .refresh {
            position: absolute;
            right: 12px;
            font-size: 19px;
        }

        .browser-actions {
            display: flex;
            gap: 20px;
            font-size: 23px;
            color: #777;
        }

        /* MAIN LAYOUT */
        .signin-page {
            display: grid;
            grid-template-columns: 56% 44%;
            min-height: calc(100vh - 87px);
            overflow: hidden;
        }

        /* LEFT SECTION */
        .form-section {
            padding: 34px 9% 50px 10.3%;
            display: flex;
            flex-direction: column;
        }

        /* KARYA LOGO - CREATED WITH HTML AND CSS */
        .brand-logo {
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            position: relative;
            width: fit-content;
            color: var(--blue);
            text-decoration: none;
            font-size: 53px;
            font-weight: 600;
            letter-spacing: 1px;
            line-height: 1.1;
            margin-bottom: 78px;
        }

        .logo-k {
            position: relative;
        }

        .logo-k::after {
            content: "";
            position: absolute;
            top: 7px;
            left: 23px;
            width: 8px;
            height: 40px;
            background: var(--yellow);
            transform: skew(-43deg);
        }

        .logo-sun {
            position: absolute;
            width: 30px;
            height: 18px;
            top: -7px;
            right: 0;
        }

        .logo-sun i {
            position: absolute;
            display: block;
            width: 5px;
            height: 11px;
            background: var(--yellow);
            border-radius: 4px;
        }

        .logo-sun i:nth-child(1) {
            left: 3px;
            top: 5px;
            transform: rotate(-35deg);
        }

        .logo-sun i:nth-child(2) {
            left: 14px;
            top: 0;
        }

        .logo-sun i:nth-child(3) {
            left: 25px;
            top: 5px;
            transform: rotate(35deg);
        }

        /* LOGIN FORM */
        .form-container {
            width: 100%;
            max-width: 530px;
            margin: 0 auto;
        }

        .form-container h1 {
            font-size: 30px;
            font-weight: 750;
            letter-spacing: -0.7px;
            margin-bottom: 37px;
        }

        /* GOOGLE BUTTON */
        .google-button {
            width: 100%;
            min-height: 45px;
            border: 1px solid #686873;
            border-radius: 8px;
            background: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-family: inherit;
            font-size: 14px;
            color: #22232b;
            cursor: pointer;
        }

        .google-button:hover {
            background: #f8f8fc;
        }

        .google-icon {
            width: 18px;
            height: 18px;
        }

        /* DIVIDER */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 21px 0 22px;
        }

        .divider span {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider p {
            font-size: 12px;
            color: var(--gray);
            white-space: nowrap;
        }

        /* INPUT FIELDS */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 29px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: #16171b;
        }

        .form-group input {
            width: 100%;
            height: 45px;
            padding: 0 12px;
            border: 1px solid #777780;
            border-radius: 8px;
            background: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.12);
        }

        .form-group input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(48, 38, 207, 0.12);
        }

        .password-group {
            margin-bottom: 0;
        }

        /* FORGOT PASSWORD */
        .forgot-password {
            display: inline-block;
            color: #6554ff;
            font-size: 12px;
            text-decoration: none;
            margin-top: 2px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* TERMS AND CONDITIONS */
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 22px;
            margin-bottom: 21px;
        }

        .terms input {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            accent-color: var(--blue);
            cursor: pointer;
        }

        .terms label {
            font-size: 12px;
            line-height: 1.6;
            color: #17171b;
        }

        .terms a {
            color: inherit;
            text-decoration: none;
        }

        /* LOGIN BUTTON */
        .login-button {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 8px;
            background: var(--dark-blue);
            color: var(--white);
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.35);
            transition: background 0.2s ease;
        }

        .login-button:hover {
            background: #24217b;
        }

        /* SIGN UP LINK */
        .signup-text {
            margin-top: 23px;
            text-align: center;
            font-size: 12px;
            color: #62626e;
        }

        .signup-text a {
            color: #3528ff;
            text-decoration: none;
            font-weight: 500;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* RIGHT SECTION: IMAGE */
        .image-section {
            min-width: 0;
            padding: 28px 5% 23px 0;
            display: flex;
            align-items: stretch;
            justify-content: flex-end;
        }

        .hero-image {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 300px;
            max-height: 350px;
            object-fit: cover;
            border-radius: 65px;

            /* Asymmetric image shape */
            clip-path: polygon(
                0 0,
                72% 0,
                72% 10%,
                90% 10%,
                100% 17%,
                100% 91%,
                100% 100%,
                29% 100%,
                29% 91%,
                12% 91%,
                0 83%
            );
        }

        /* TABLET RESPONSIVE */
        @media (max-width: 1000px) {
            .signin-page {
                grid-template-columns: 52% 48%;
            }

            .form-section {
                padding-left: 7%;
                padding-right: 7%;
            }

            .brand-logo {
                font-size: 46px;
                margin-bottom: 65px;
            }

            .form-container h1 {
                font-size: 27px;
            }

            .hero-image {
                min-height: 600px;
            }
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 700px) {
            .browser-bar {
                height: 58px;
                padding: 0 14px;
                gap: 12px;
            }

            .browser-arrows,
            .browser-actions {
                display: none;
            }

            .signin-page {
                display: flex;
                flex-direction: column;
                min-height: calc(100vh - 58px);
                overflow: visible;
            }

            .form-section {
                padding: 28px 7% 40px;
            }

            .brand-logo {
                font-size: 43px;
                margin-bottom: 52px;
            }

            .form-container h1 {
                font-size: 27px;
                margin-bottom: 28px;
            }

            .image-section {
                padding: 0 7% 30px;
                min-height: 300;
            }

            .hero-image {
                width: 100%;
                min-height: 300px;
                max-height: 350px;
                border-radius: 40px;
                clip-path: none;
            }
        }

        @media (max-width: 400px) {
            .form-section {
                padding-left: 6%;
                padding-right: 6%;
            }

            .form-container h1 {
                font-size: 25px;
            }

            .terms label {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <!-- Decorative browser header -->
    <header class="browser-bar">
        <div class="traffic-lights">
            <span class="light red"></span>
            <span class="light yellow-light"></span>
            <span class="light green"></span>
        </div>

        <div class="browser-arrows">
            <span>‹</span>
            <span>›</span>
        </div>

        <div class="address-bar">
            <span>⌕ &nbsp; Search or enter website name</span>
            <span class="refresh">↻</span>
        </div>

        <div class="browser-actions">
            <span>⇧</span>
            <span>＋</span>
            <span>▢</span>
        </div>
    </header>

    <!-- Main sign in page -->
    <main class="signin-page">

        <!-- Left side: logo and form -->
        <section class="form-section">

            <!-- Karya logo created with CSS -->
            <a href="#" class="brand-logo" aria-label="Karya Home">
                <span class="logo-k">K</span><span>arya</span>
                <span class="logo-sun">
                    <i></i>
                    <i></i>
                    <i></i>
                </span>
            </a>

            <div class="form-container">
                <h1>Welcome Back!</h1>

                <form action="#" method="post">

                    <!-- Google icon is embedded as SVG -->
                    <button type="button" class="google-button">
                        <svg class="google-icon"
                             xmlns="http://www.w3.org/2000/svg"
                             viewBox="0 0 48 48"
                             aria-hidden="true">
                            <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15z"/>
                            <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.8 1.2-4 2-6.8 2-5.2 0-9.6-3.5-11.2-8.2H5.9v5.2A20 20 0 0 0 24 44z"/>
                            <path fill="#FBBC05" d="M12.8 27.8a12 12 0 0 1 0-7.6V15H5.9a20 20 0 0 0 0 18z"/>
                            <path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 5.8 29.5 4 24 4A20 20 0 0 0 5.9 15l6.9 5.2C14.4 15.5 18.8 12 24 12z"/>
                        </svg>
                        <span>Continue with Google</span>
                    </button>

                    <div class="divider">
                        <span></span>
                        <p>or use email</p>
                        <span></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required>
                    </div>

                    <div class="form-group password-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required>
                    </div>

                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>

                    <div class="terms">
                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            required>

                        <label for="terms">
                            I agree to the
                            <a href="#">Terms of Use</a>
                            and
                            <a href="#">Privacy Policy</a>.
                        </label>
                    </div>

                    <button type="submit" class="login-button">
                        <a href="home.html">Log In</a>
                    </button>

                    <p class="signup-text">
                        Don’t have an account?
                        <a href="signup.html">Sign up</a>
                    </p>

                </form>
            </div>
        </section>

        <!-- Right side: main illustration -->
        <aside class="image-section">

            <!-- Replace this path with your own image -->
            <img src="image signin.png" alt="A person writing in a planner at a desk" class="hero-image">

        </aside>

    </main>

</body>
</html>
